name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"  # weekly, Monday 14:17 UTC: pick up new state data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write  # report new sources that need a person, and failed builds (DECISIONS D-043)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Look for newly published source files
        run: python -m ingest discover
      - name: Fetch and parse public data
        run: python -m ingest budget_bills budget_current budget_to_actual budget_to_actual_detail legislature vendor_payments outlook collections
      - name: Reconcile against published totals
        run: python -m ingest checks
      - name: Build site data
        run: python -m publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Open an issue for new sources that need a person
        if: always() && hashFiles('data/samples/freshness.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/report_issues.py attention

      - name: Open an issue if the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/report_issues.py failure

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
